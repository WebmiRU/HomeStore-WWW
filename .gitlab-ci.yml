stages:
  - build
  - deploy

variables:
  PROJECT_NAME: www
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  KUBE_NAMESPACE: home-store
  KUBE_DEPLOYMENT: www-app

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - docker info
  script:
    - echo "Building image for $CI_COMMIT_BRANCH ($CI_COMMIT_SHORT_SHA)"
    - docker build
        -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
        -t $IMAGE_NAME:dev
        -f .kube/www/Dockerfile
        .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - if [ "$CI_COMMIT_BRANCH" = "dev" ] || [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker push $IMAGE_NAME:dev;
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

deploy:
  stage: deploy
  image: alpine/k8s:1.31.0
  before_script:
    - mkdir -p /root/.kube
    - echo "$KUBE_CONFIG" > /root/.kube/config
  script:
    - echo "Deploying $IMAGE_NAME:$CI_COMMIT_SHORT_SHA to $KUBE_NAMESPACE"
    - |
      kubectl set image deployment/$KUBE_DEPLOYMENT \
        $KUBE_DEPLOYMENT=$IMAGE_NAME:$CI_COMMIT_SHORT_SHA \
        -n $KUBE_NAMESPACE
      kubectl rollout status deployment/$KUBE_DEPLOYMENT \
        -n $KUBE_NAMESPACE --timeout=300s
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
